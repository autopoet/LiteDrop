[project]
name = "litedrop-backend"
version = "2.0.0"
description = "A small FastAPI service for resumable file sharing"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
